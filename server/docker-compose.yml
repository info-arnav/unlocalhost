name: unlocalhost

x-service-defaults: &service-defaults
  restart: unless-stopped
  stop_grace_period: 15s
  build:
    context: ..
    dockerfile: server/Dockerfile

services:
  postgres:
    image: postgres:18.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s

  redis:
    image: redis:8.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 15s

  gateway:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: gateway
    depends_on:
      redis:
        condition: service_healthy
      control-plane:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV}
      RELEASE: ${RELEASE}
      PORT: 8000
      BASE_DOMAIN: ${BASE_DOMAIN}
      REDIS_URL: ${REDIS_URL}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL}
      RATE_LIMIT_POINTS: ${RATE_LIMIT_POINTS}
      RATE_LIMIT_DURATION_SEC: ${RATE_LIMIT_DURATION_SEC}
      INTERNAL_AUTH_KEY: ${INTERNAL_AUTH_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  control-plane:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: control-plane
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      RELEASE: ${RELEASE}
      PORT: 7100
      DATABASE_URL: ${DATABASE_URL}
      BASE_DOMAIN: ${BASE_DOMAIN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MAX_CONCURRENT_BUILDS: ${MAX_CONCURRENT_BUILDS}
      BUILD_TIMEOUT_MS: ${BUILD_TIMEOUT_MS}
      INTERNAL_AUTH_KEY: ${INTERNAL_AUTH_KEY}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET}
      GITHUB_APP_PRIVATE_KEY_PATH: /app/server/secrets/github-app.pem
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
    volumes:
      - ./secrets:/app/server/secrets:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:7100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  auth-gate:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: auth-gate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      RELEASE: ${RELEASE}
      PORT: 7001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BASE_DOMAIN: ${BASE_DOMAIN}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      AUTH_SECRET: ${AUTH_SECRET}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:7001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  activator:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: activator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      RELEASE: ${RELEASE}
      PORT: 7002
      DATABASE_URL: ${DATABASE_URL}
      IDLE_TIMEOUT_MS: ${IDLE_TIMEOUT_MS}
      SWEEP_INTERVAL_MS: ${SWEEP_INTERVAL_MS}
      COLD_START_TIMEOUT_MS: ${COLD_START_TIMEOUT_MS}
      SENTRY_DSN: ${SENTRY_DSN}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:7002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - gateway
      - auth-gate
      - activator
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    stop_grace_period: 15s

volumes:
  pgdata:
  redisdata:
  caddy-data:
  caddy-config:
